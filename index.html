<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Lucas Hanson</title>
    <link rel="icon" type="image/x-icon" href="images/logo.ico"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="CTO at EcoRay and Amateur Photographer">

    <!-- Keywords -->
    <meta name="keywords" content="Lucas Hanson, Software Developer, Photographer, Links">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://links.lucashanson.dk/">

    <!-- Author Information -->
    <meta name="Lucas Hanson" content="Links to my social media profiles and websites.">

    <!-- Typography shared with lucashanson.dk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

  </head>
